name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USERNAME: jeyapragash1
      OUT_PATH: stats/github_stats.svg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate GitHub stats SVG
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          python scripts/generate_stats.py --username "$USERNAME" --token "$GH_TOKEN" --out "$OUT_PATH"

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/github_stats.svg || true
          if git diff --quiet --cached; then echo "No changes to commit"; else git commit -m "chore(stats): update generated github stats" && git push; fi
